<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#0e1116"/>
  <!-- Amber border -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#f5a623" stroke-width="1.5"/>
  <!-- Inner amber block -->
  <rect x="5" y="5" width="22" height="22" rx="3" fill="#a06010"/>
  <!-- "3D" text -->
  <text x="16" y="22" font-family="'DejaVu Sans', Arial, sans-serif" font-weight="bold"
        font-size="13" fill="#ffcc66" text-anchor="middle" letter-spacing="0.5">3D</text>
</svg>
